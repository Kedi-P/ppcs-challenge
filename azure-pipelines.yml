# azure-pipelines.yml — PPCS CI (runs inside the Coles perimeter via Azure DevOps)
#
# The coordination repo is private; the Lakebase workspace is firewalled. CI runs
# on Coles self-hosted agents that can reach Lakebase, authenticating to
# Databricks via an Azure service connection (SP) — no secrets stored in the repo
# or in variable groups. Follows the same shape as the EDP yws_framework pipeline.
#
# Two stages (in azure-pipelines.template.yml):
#   unit         — pytest + PPCS-001 baseline gate. Runs on every push/PR.
#   lakebase_ci  — ephemeral Lakebase branch off production -> migrate an isolated
#                  CI schema on the clone -> integration tests -> always tear down.
#                  Gated on runLakebaseCI == 'true'.

trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

parameters:
  - name: runLakebaseCI
    displayName: Run the live Lakebase branch-per-PR stage
    type: string
    default: "false"
    values:
      - "false"
      - "true"
  - name: pythonVersion
    displayName: Python version
    type: string
    default: "3.11"

stages:
  - template: azure-pipelines.template.yml
    parameters:
      pythonVersion: ${{ parameters.pythonVersion }}
      runLakebaseCI: ${{ parameters.runLakebaseCI }}

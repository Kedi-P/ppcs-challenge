name: PPCS CI

# Runs the PPCS service test suite on team branches.
#
# The challenge ships ONE intentional failing seed test (PPCS-001,
# tests/test_rules.py::test_marginal_discount_below_threshold_fails).
# The documented baseline is therefore "6 passed, 1 failed".
#
# This workflow treats that exact baseline as SUCCESS and fails CI only if:
#   - any test OTHER than the PPCS-001 seed fails (a real regression), or
#   - the suite errors / can't run.
# It does NOT reward "fixing" the seed silently — the seed is expected to
# stay red until a team deliberately solves PPCS-001.

on:
  pull_request:
    branches:
      - "team-*"
  push:
    branches:
      - "team-*"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync

      - name: Run tests (JUnit output)
        # Do not fail the step here; we evaluate results in the next step so we
        # can tolerate the single intentional PPCS-001 seed failure.
        run: uv run pytest -q --junitxml=../pytest-report.xml || true

      - name: Evaluate baseline (tolerate only the PPCS-001 seed failure)
        working-directory: .
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          SEED = "test_marginal_discount_below_threshold_fails"  # PPCS-001

          tree = ET.parse("pytest-report.xml")
          root = tree.getroot()
          suites = root.iter("testsuite") if root.tag == "testsuites" else [root]

          unexpected = []
          seed_failed = False
          total = 0
          for suite in suites:
              for case in suite.iter("testcase"):
                  total += 1
                  name = case.get("name", "")
                  failed = any(c.tag in ("failure", "error") for c in case)
                  if not failed:
                      continue
                  if SEED in name:
                      seed_failed = True
                  else:
                      unexpected.append(f"{case.get('classname','')}::{name}")

          print(f"Collected {total} tests.")
          print(f"PPCS-001 seed failing (expected): {seed_failed}")

          if unexpected:
              print("::error::Unexpected test failures (regressions):")
              for u in unexpected:
                  print(f"  - {u}")
              sys.exit(1)

          if total == 0:
              print("::error::No tests were collected — suite could not run.")
              sys.exit(1)

          print("Baseline OK: only the intentional PPCS-001 seed is red (or a team has solved it and all tests pass).")
          PY

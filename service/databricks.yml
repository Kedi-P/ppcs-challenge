bundle:
  name: ppcs-coda-challenge

# The PPCS app is deployed from THIS repo (dgokeeffe/ppcs-challenge) via a
# Databricks Git folder, not from a hand-staged Workspace Files copy. See
# ../CI-AND-PROMOTION.md and challenge deploy docs for the git-deployment flow.

sync:
  exclude:
    - .venv/**
    - .pytest_cache/**
    - tests/**

resources:
  apps:
    ppcs_coda_challenge:
      name: ppcs-coda-challenge
      description: Enterprise CoDA Engineering Challenge PPCS workshop app
      source_code_path: .
      config:
        command:
          - /bin/bash
          - -c
          - uvicorn app.main:app --host 0.0.0.0 --port ${DATABRICKS_APP_PORT:-8000}
        env:
          - name: PPCS_ENV
            value: workshop
          - name: PPCS_OPERATING_ENVELOPE
            value: coda-challenge-v1
          - name: PPCS_TEAM_SCHEMA
            value: REPLACE_WITH_TEAM_SCHEMA
          - name: PPCS_EVENTS_TABLE
            value: REPLACE_WITH_EVENTS_TABLE
          - name: PPCS_TELEMETRY_SCHEMA
            value: REPLACE_WITH_TELEMETRY_SCHEMA
          - name: PPCS_SQL_WAREHOUSE_ID
            value: REPLACE_WITH_SQL_WAREHOUSE_ID
          - name: PPCS_ALLOWED_EVENTS_TABLE
            value: main.coda_challenge.ppcs_validation_events
          - name: PPCS_DENIED_MARGIN_OBJECT
            value: main.coda_challenge.restricted_margin_by_sku
          - name: PPCS_LAKEBASE_TARGET
            value: REPLACE_WITH_LAKEBASE_TARGET
          - name: PPCS_LAKEBASE_HOST
            value: REPLACE_WITH_LAKEBASE_HOST

targets:
  daveok:
    mode: development
    workspace:
      profile: daveok

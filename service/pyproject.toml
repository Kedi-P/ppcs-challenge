[project]
name = "ppcs"
version = "0.1.0"
description = "Promotional Pricing Compliance Service — CoDA challenge backlog service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
    "databricks-sdk>=0.40",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
